<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | Cozy Loops Crochet</title>
  
  <!-- Modern Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- CSS Styles -->
  <link rel="stylesheet" href="styles.css">
  
  <style>
    body {
      margin: 0;
      padding: 0;
      background: var(--porcelain-white);
      font-family: var(--font-body);
      color: var(--onyx-black);
    }
  </style>
</head>
<body>

  <!-- DEDICATED FULL-PAGE ADMIN VIEWPORT -->
  <div id="adminView" style="min-height: 100vh; background: var(--porcelain-white);"></div>

  <!-- Toast Notification Container -->
  <div id="toast" class="toast-notification"></div>

  <!-- JavaScript Modules -->
  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/admin.js"></script>
  
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (window.adminDashboard) {
        window.adminDashboard.renderAdminView();
      }
    });
  </script>

</body>
</html>
